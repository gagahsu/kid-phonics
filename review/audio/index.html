    c.querySelectorAll('.pick button').forEach(x=>x.classList.toggle('sel',x===b));upd()});
  list.appendChild(c)});
function upd(){document.getElementById('cnt').textContent=Object.keys(P).length+' / '+D.length+' 已選';
  document.getElementById('out').value=Object.entries(P).map(([k,v])=>k+':'+v).join(' ')}
function copyOut(){const t=document.getElementById('out');t.select();navigator.clipboard?.writeText(t.value).then(()=>alert('已複製，貼給 Claude 就好'),()=>document.execCommand('copy'))}
function nextTodo(){const i=D.findIndex(it=>!P[it.zy]);if(i>=0)document.getElementById('s'+i).scrollIntoView({behavior:'smooth',block:'center'})}
upd();
